<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prix des pizzas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.mjs"></script>
</head>

<body>
  <main class="container py-5">
    <h1 class="mb-4">Les pizzas de SuperDupont 🍕</h1>

    <div class="card shadow-sm">
      <div class="card-body">
        <label for="pizzaName" class="form-label">Choisir une pizza</label>

        <div class="input-group">
          <select id="pizzaName" class="form-select">
            <option value="">Chargement...</option>
          </select>

          <button id="calculate" class="btn btn-primary">
            Calculer le prix
          </button>

          <button id="ingredients" class="btn btn-secondary">
            Ingrédients
          </button>
        </div>

        <div id="result" class="mt-3" aria-live="polite"></div>
        <div id="ingredientsResult" class="mt-3"></div>
      </div>
    </div>
  </main>
</body>

</html>
